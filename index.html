<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earlyworx 769 · Production board</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Earlyworx 769<small>Production board</small></h1>
    <div class="btns">
      <button class="btn" id="exp">Export CSV</button>
      <button class="btn pri" id="add">+ New job</button>
    </div>
  </header>
  <section class="sum" id="sum"></section>
  <section class="bar">
    <input type="search" id="q" placeholder="Search client, order #, RAMBO, TSHEPI…" autocomplete="off">
    <div class="chips" id="chips"></div>
  </section>
  <section class="list" id="list"></section>
  <p class="foot">Jobs are saved in this browser on this device only.</p>
</div>

<dialog id="dlg">
  <form id="f" method="dialog">
    <h2 id="ft">New job</h2>
    <label>Client<input name="client" required maxlength="80"></label>
    <div class="two">
      <label>Order #<input name="order" maxlength="30"></label>
      <label>Department<select name="dept" id="dsel"></select></label>
    </div>
    <div class="two">
      <label>Quantity<input name="qty" type="number" min="1" step="1" value="1" required></label>
      <label>Price per item (R)<input name="price" type="number" min="0" step="0.01" value="0" required></label>
    </div>
    <label>Due date<input name="due" type="date"></label>
    <label>Description<textarea name="desc" rows="3" maxlength="400"></textarea></label>
    <div class="fb">
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button type="submit" class="btn pri">Save job</button>
    </div>
  </form>
</dialog>

<dialog id="xdlg">
  <div class="dlg">
    <h2>CSV export</h2>
    <p style="margin:0;color:var(--mute);font-size:13.5px">Copy this and paste it into Excel, Google Sheets or an email to your accountant.</p>
    <textarea class="csv" id="csv" readonly></textarea>
    <div class="fb">
      <button class="btn" id="xcopy">Copy</button>
      <button class="btn pri" id="xclose">Close</button>
    </div>
  </div>
</dialog>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
